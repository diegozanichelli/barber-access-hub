name: CI

# Runs the three checks the README already defines as the project's own
# verification, on every pull request and on main. Without this nothing
# compiles the code before it merges: a duplicate identifier and a call to an
# undefined function reached main once because no automated check ran.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Ações, útil para conferir a CI sem
  # precisar abrir uma PR. Só aparece depois que este arquivo estiver na main.
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # --frozen-lockfile: CI installs exactly what bun.lock pins and fails
      # loudly instead of silently resolving something else.
      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Testes
        run: bun test

      # vite build runs esbuild, which rejects duplicate declarations — the
      # class of error that broke this repo before.
      - name: Build
        run: bun run build
